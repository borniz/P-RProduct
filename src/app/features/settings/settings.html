<div class="space-y-6 max-w-3xl mx-auto">
  <div>
    <h1 class="text-2xl font-bold text-white tracking-tight">Configuración del Sistema</h1>
    <p class="text-sm text-slate-400 mt-0.5">Personaliza la experiencia visual y el comportamiento del ERP</p>
  </div>

  <div class="bg-brand-surface border border-brand-border rounded-2xl p-6 space-y-6 text-sm">
    <!-- Bloque de Preferencias de Visualización -->
    <div class="space-y-3">
      <div>
        <h2 class="text-base font-semibold text-white tracking-tight">Visualización de Inventarios</h2>
        <p class="text-xs text-slate-500 mt-0.5">Selecciona cómo deseas que se listen los artículos en el catálogo maestro y módulos operativos</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
        
        <!-- Tarjeta de Opción 1: Tabla de Datos Tradicional -->
        <button (click)="changeViewMode('table')" type="button"
                [class]="currentMode() === 'table' ? 'border-status-info bg-status-info/5 text-white' : 'border-brand-border bg-brand-bg text-slate-400 hover:text-white'"
                class="flex items-start gap-4 p-4 rounded-xl border text-left transition-all cursor-pointer group">
          <div class="p-2 rounded-lg bg-brand-surface border border-brand-border text-status-info">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 5.25h16.5m-16.5 4.5h16.5m-16.5 4.5h16.5m-16.5 4.5h16.5" /></svg>
          </div>
          <div>
            <span class="block font-semibold text-sm">Vista de Lista (Tabla)</span>
            <span class="block text-xs text-slate-500 mt-0.5">Despliega celdas compactas con SKU, stock mínimo, mappers y precios tabulares.</span>
          </div>
        </button>

        <!-- Tarjeta de Opción 2: Cuadrícula Visual Premium (Look como en tu Imagen POS) -->
        <button (click)="changeViewMode('grid')" type="button"
                [class]="currentMode() === 'grid' ? 'border-status-info bg-status-info/5 text-white' : 'border-brand-border bg-brand-bg text-slate-400 hover:text-white'"
                class="flex items-start gap-4 p-4 rounded-xl border text-left transition-all cursor-pointer group">
          <div class="p-2 rounded-lg bg-brand-surface border border-brand-border text-status-purple">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H18a2.25 2.25 0 0 1-2.25-2.25v-2.25z" /></svg>
          </div>
          <div>
            <span class="block font-semibold text-sm">Vista de Catálogo (Cuadrícula con Fotos)</span>
            <span class="block text-xs text-slate-500 mt-0.5">Organiza el inventario en tarjetas dinámicas dándole protagonismo absoluto a la foto del producto.</span>
          </div>
        </button>

      </div>
    </div>
  </div>
</div>

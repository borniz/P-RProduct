<div class="space-y-6 max-w-3xl mx-auto">
  <!-- Cabecera Dinámica Reactiva -->
  <div>
    <h1 class="text-2xl font-bold text-white tracking-tight">{{ pageTitle() }}</h1>
    <p class="text-sm text-slate-400 mt-0.5">{{ pageSubtitle() }}</p>
  </div>

  <form (submit)="onSubmit($event)" class="bg-brand-surface border border-brand-border rounded-2xl p-6 space-y-5 text-sm">
    
    @if (errorMessage()) {
      <div class="p-3 bg-status-danger/10 border border-status-danger/20 rounded-xl text-xs font-semibold text-status-danger">
        {{ errorMessage() }}
      </div>
    }

    <!-- SECCIÓN DE CARGA DE IMAGEN -->
    <div class="space-y-2">
      <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Imagen del Producto (Opcional)</label>
      <div class="flex flex-col sm:flex-row items-center gap-5 p-4 bg-brand-bg border border-brand-border rounded-xl">
        @if (imagePreview()) {
          <div class="relative w-32 h-32 rounded-xl overflow-hidden border border-brand-border bg-brand-surface shrink-0 group shadow-md">
            <img [src]="imagePreview()" alt="Preview" class="w-full h-full object-cover" />
            <button (click)="removeImage()" type="button" class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center text-status-danger font-semibold text-xs transition-opacity duration-150 cursor-pointer">Eliminar</button>
          </div>
          <div class="text-center sm:text-left">
            <p class="text-sm font-medium text-white">Imagen cargada con éxito</p>
            <p class="text-xs text-slate-500 mt-1">Pasa el cursor sobre la imagen para quitarla o reemplazarla.</p>
          </div>
        } @else {
          <label class="w-full flex flex-col items-center justify-center py-6 px-4 border-2 border-dashed border-brand-border hover:border-status-info rounded-xl cursor-pointer bg-brand-surface/40 hover:bg-brand-surface/70 transition-all text-center group">
            <svg class="w-8 h-8 text-slate-500 group-hover:text-status-info transition-colors mb-2" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" /></svg>
            <span class="text-xs font-semibold text-slate-300 group-hover:text-white transition-colors">Presiona para cargar una imagen</span>
            <input (change)="onFileSelected($event)" type="file" accept="image/*" class="hidden" />
          </label>
        }
      </div>
    </div>

    <!-- Nombre del Producto -->
    <div class="space-y-1">
      <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Nombre del Producto *</label>
      <input (input)="onInputName($event)" [value]="name()" type="text" placeholder="Ej. Sierra Circular 1400W" class="w-full bg-brand-bg border border-brand-border text-slate-200 px-3 py-2.5 rounded-xl focus:outline-none focus:border-status-info transition-colors" />
    </div>

    <!-- Fila Doble: SKU y Categoría Dinámica -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="space-y-1">
        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Código SKU (Opcional)</label>
        <input (input)="onInputSku($event)" [value]="sku()" type="text" placeholder="Ej. HER-SC1400" class="w-full bg-brand-bg border border-brand-border text-slate-200 px-3 py-2.5 rounded-xl focus:outline-none focus:border-status-info transition-colors uppercase" />
      </div>
      <div class="space-y-1">
        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Categoría de Lote</label>
        <select (change)="onSelectCategory($event)" [value]="category()" class="w-full bg-brand-bg border border-brand-border text-slate-600 px-3 py-2.5 rounded-xl focus:outline-none focus:border-status-info transition-colors cursor-pointer font-medium">
          @for (cat of categoriesList(); track cat.id) {
            <option [value]="cat.name">{{ cat.name }}</option>
          }
          <option value="categoryCreate"> + Crear Categoria</option>
        </select>
      </div>
    </div>
    <!-- 📌 NUEVA FILA DOBLE REUTILIZABLE: Marcas y Unidades de Medida Dinámicas -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="space-y-1">
        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Fabricante / Marca</label>
        <select (change)="onSelectBrand($event)" [value]="brand()" class="w-full bg-brand-bg border border-brand-border text-slate-600 px-3 py-2.5 rounded-xl focus:outline-none focus:border-status-info transition-colors cursor-pointer font-medium">
          @for (br of brandsList(); track br.id) {
            <option [value]="br.name">{{ br.name }}</option>
          }
          <option value="brandCreate"> + Crear Marca</option>
        </select>
      </div>
      <div class="space-y-1">
        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Unidad de Despacho</label>
        <select (change)="onSelectUnit($event)" [value]="unit()" class="w-full bg-brand-bg border border-brand-border text-slate-600 px-3 py-2.5 rounded-xl focus:outline-none focus:border-status-info transition-colors cursor-pointer font-medium">
          @for (un of unitsList(); track un.id) {
            <option [value]="un.name">{{ un.name }}</option>
          }
          <option value="unitCreate"> + Crear nueva Unidad De medida</option>
        </select>
      </div>
    </div>

    <!-- Stock Inicial y Stock Mínimo -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="space-y-1">
        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Stock Inicial</label>
        <input (input)="onInputStock($event)" [value]="formatVisual(stock())" type="text" class="w-full bg-brand-bg border border-brand-border text-slate-200 px-3 py-2.5 rounded-xl focus:outline-none focus:border-status-info transition-colors font-mono" />
      </div>
      <div class="space-y-1">
        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Stock Mínimo</label>
        <input (input)="onInputMinStock($event)" [value]="formatVisual(minStock())" type="text" class="w-full bg-brand-bg border border-brand-border text-slate-200 px-3 py-2.5 rounded-xl focus:outline-none focus:border-status-info transition-colors font-mono" />
      </div>
    </div>

    <!-- Precios de Compra y Venta -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="space-y-1">
        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Precio de Compra  </label>
        <input (input)="onInputBuyPrice($event)" [value]="formatVisual(buyPrice())" type="text" class="w-full bg-brand-bg border border-brand-border text-slate-200 px-3 py-2.5 rounded-xl focus:outline-none focus:border-status-info transition-colors font-mono" />
      </div>
      <div class="space-y-1">
        <label class="block text-xs font-medium text-slate-400 uppercase tracking-wider">Precio de Venta  </label>
        <input (input)="onInputUnitPrice($event)" [value]="formatVisual(unitPrice())" type="text" class="w-full bg-brand-bg border border-brand-border text-slate-200 px-3 py-2.5 rounded-xl focus:outline-none focus:border-status-info transition-colors font-mono" />
      </div>
    </div>

    <!-- Botonera Operativa Unificada -->
    <div class="pt-4 border-t border-brand-border flex items-center justify-end gap-3">
      <button (click)="cancel()" type="button" class="px-4 py-2.5 border border-brand-border text-slate-400 hover:text-white rounded-xl font-semibold hover:bg-brand-hover transition-all cursor-pointer">
        Cancelar
      </button>
      <button type="submit" class="px-5 py-2.5 bg-status-info hover:bg-status-info/90 text-white rounded-xl font-semibold shadow-md transition-all cursor-pointer">
        {{ submitButtonText() }}
      </button>
    </div>
  </form>
</div>

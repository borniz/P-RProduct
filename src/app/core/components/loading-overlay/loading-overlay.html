@if (isActive()) {
  <!-- Contenedor absoluto que congela los clics externos en todo el sistema -->
  <div class="fixed inset-0 bg-black/75 backdrop-blur-xs flex flex-col items-center justify-center z-[9999] animate-fade-in select-none">
    
    <!-- Tarjeta del Panel de Progreso Real -->
    <div class="w-72 bg-slate-900 border border-brand-border rounded-2xl p-5 space-y-4 shadow-2xl text-center">
      
      <div class="space-y-1">
        <span class="block text-xs font-bold text-slate-400 uppercase tracking-wider animate-pulse truncate px-1">
          {{ message() }}
        </span>
        <!-- Contador de Porcentaje Digital de Alta Precisión -->
        <span class="block font-mono font-black text-status-success text-2xl tracking-tighter tabular-nums">
          {{ progress() }}%
        </span>
      </div>

      <!-- Autopista de la Barra de Carga -->
      <div class="w-full h-2 bg-brand-bg rounded-full overflow-hidden border border-brand-border/40 p-[1px]">
        <!-- 📌 BARRA DE PORCENTAJE REAL: Lee [style.width.%]="progress()" 
             con transiciones controladas por CSS para una fluidez óptima -->
        <div class="h-full bg-gradient-to-r from-status-info via-status-purple to-status-success rounded-full transition-all duration-300 ease-out shadow-[0_0_8px_rgba(2,132,199,0.3)]"
             [style.width.%]="progress()">
        </div>
      </div>
      
    </div>

  </div>
}

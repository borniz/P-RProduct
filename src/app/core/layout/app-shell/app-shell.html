<div class="min-h-screen bg-ferremas-bg flex relative">
  
  <!-- Fondo oscuro translúcido para cerrar el menú móvil al hacer clic fuera -->
  @if (isMobileMenuOpen()) {
    <div class="fixed inset-0 bg-black/60 backdrop-blur-xs z-40 lg:hidden transition-opacity duration-200"
         (click)="closeMobileMenu()">
    </div>
  }

  <!-- Menú Lateral: Se le pasa el estado de apertura actual -->
  <app-sidebar [class.translate-x-0]="isMobileMenuOpen()" 
               (linkClicked)="closeMobileMenu()"
               class="fixed top-0 bottom-0 left-0 w-64 -translate-x-full lg:translate-x-0 transition-transform duration-300 z-50">
  </app-sidebar>

  <!-- Panel de Contenido Principal Adaptable -->
  <div class="flex-1 flex flex-col pl-0 lg:pl-64 min-w-0 transition-all duration-300">
    <!-- Header Superior: Escucha el evento para abrir el menú móvil -->
    <app-header (toggleMenu)="toggleMobileMenu()"></app-header>

    <!-- Área de Trabajo Principal Elástica -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 mt-16 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

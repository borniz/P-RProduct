<header class="h-16 bg-ferremas-surface border-b border-ferremas-border flex items-center justify-between px-4 sm:px-6 lg:px-8 fixed top-0 right-0 left-0 lg:left-64 z-40 transition-all duration-300">
  
  <div class="flex items-center gap-3 flex-1 max-w-xs sm:max-w-md">
    <!-- Botón Hamburguesa: Visible ÚNICAMENTE en móviles y tablets (< 1024px) -->
    <button (click)="toggleMenu.emit()" 
            type="button" 
            class="p-2 -ml-1 text-slate-400 hover:text-white rounded-xl bg-ferremas-bg border border-ferremas-border lg:hidden transition-colors cursor-pointer">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>

    <!-- Buscador Integrado Flexible -->
    <div class="flex-1 relative">
      <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-500">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.603 10.603z" />
        </svg>
      </span>
      <input type="text" placeholder="Buscar..." 
             class="w-full bg-ferremas-bg border border-ferremas-border text-sm text-slate-200 pl-9 pr-4 py-2 rounded-xl focus:outline-none focus:border-status-info placeholder-slate-500 transition-colors">
    </div>
  </div>

  <!-- Controles del Lado Derecho Compactos -->
  <div class="flex items-center gap-2 sm:gap-4 pl-3">
    <!-- Centro de Alertas -->
    <button class="p-2 text-slate-400 hover:text-white bg-ferremas-bg border border-ferremas-border rounded-xl relative transition-colors cursor-pointer">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
      </svg>
      <span class="absolute top-2 right-2 w-2 h-2 bg-status-danger rounded-full"></span>
    </button>

    <div class="h-6 w-px bg-ferremas-border"></div>

    <!-- Selector de Sucursal Inteligente (Adapta su texto según el tamaño) -->
    <button class="flex items-center gap-1.5 px-2.5 py-2 bg-ferremas-bg border border-ferremas-border rounded-xl text-xs sm:text-sm font-medium text-slate-200 hover:border-slate-700 transition-colors cursor-pointer">
      <svg class="w-4 h-4 text-status-info shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.993 2.993 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 002.25 1.016c.896 0 1.7-.393 2.25-1.015a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72l1.189-1.19A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72M6.75 18h3.5a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75h-3.5a.75.75 0 00-.75.75v3.75c0 .414.336.75.75.75z" />
      </svg>
      <span class="hidden sm:inline">Seleccionar Sede</span>
      <span class="sm:hidden">Sede</span>
      <svg class="w-3 h-3 text-slate-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
      </svg>
    </button>
  </div>
</header>

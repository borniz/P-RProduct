<!-- 📌 ESTRUCTURA BLINDADA: Altura fija a la pantalla (h-screen) para habilitar scroll interno -->
<aside class="w-64 h-screen bg-ferremas-surface border-r border-brand-border text-slate-400 flex flex-col justify-between shadow-2xl lg:shadow-none select-none">
  
  <!-- Bloque Superior: Logo + Contenedor de Navegación con Desplazamiento -->
  <div class="flex-1 flex flex-col min-h-0">
    
    <!-- Logo Identificador (Anclado fijo arriba) -->
    <div class="h-16 flex items-center px-6 border-b border-brand-border gap-3 shrink-0">
      <svg class="w-7 h-7 text-status-info" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
      </svg>
      <span class="font-bold text-white text-base tracking-wider uppercase bg-clip-text bg-gradient-to-r from-white to-slate-400">B&R Solutions</span>
    </div>

    <!-- 🚀 ZONA DE NAVEGACIÓN CON SCROLL INTERNO INDEPENDIENTE: 
         La clase 'overflow-y-auto' y 'scrollbar-thin' permiten que el menú ruede hacia abajo 
         si la pantalla se acorta, manteniendo el logo y el pie de usuario fijos en los extremos. -->
    <nav class="flex-1 overflow-y-auto mt-4 px-4 space-y-1.5 scrollbar-thin scrollbar-thumb-brand-border/60 scrollbar-track-transparent">
      @for (item of menuItems(); track item.label) {
        <a [routerLink]="item.route" 
           routerLinkActive="bg-status-info/20 border border-status-info/30 text-white font-medium shadow-sm"
           (click)="onMenuOptionSelected()"
           class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs transition-all duration-150 hover:bg-brand-hover/40 hover:text-white cursor-pointer group tracking-wide border border-transparent">
          <svg class="w-4 h-4 text-slate-400 group-hover:text-white transition-colors shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.iconPath" />
          </svg>
          <span class="truncate">{{ item.label }}</span>
        </a>
      }
    </nav>
  </div>

  <!-- 👤 SECCIÓN INFERIOR: IDENTIFICACIÓN DINÁMICA DEL OPERADOR CONECTADO (Anclado fijo abajo) -->
  <div class="p-4 border-t border-brand-border flex items-center gap-3 bg-brand-bg/50 shrink-0 select-none">
    <!-- Iniciales calculadas automáticamente en base al Signal del AuthService -->
    <div class="w-9 h-9 bg-status-info/10 text-status-info font-mono font-black rounded-xl flex items-center justify-center text-xs border border-status-info/20 shadow-inner shrink-0">
      {{ currentOperatorName().substring(0,2).toUpperCase() }}
    </div>
    <div class="flex flex-col min-w-0 text-left text-xs">
      <!-- Datos reactivos: Sincronizan al instante si cambias de cajero en la cabecera -->
      <span class="font-bold text-slate-200 truncate">{{ currentOperatorName() }}</span>
      <span class="text-[10px] text-slate-500 font-mono tracking-wider uppercase mt-0.5">{{ currentOperatorRole() }}</span>
    </div>
  </div>

</aside>
